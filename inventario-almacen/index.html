<!DOCTYPE html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventario de Almacén</title>
  <script>
    // Aplica el tema guardado antes de pintar para evitar el parpadeo.
    try { const t = localStorage.getItem('inventario-tema'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <aside id="lateral">
    <a class="marca" href="#resumen">
      <span id="logo" class="logo"></span>
      <span class="marca-texto"><b id="empresa-nombre"></b><small id="empresa-almacen"></small></span>
    </a>
    <button class="btn-menu" data-accion="menu" aria-label="Abrir menú">☰</button>
    <nav id="menu">
      <a href="#resumen" data-icono="inicio">Panel</a>
      <a href="#ordenes" data-icono="ordenes">Órdenes</a>
      <a href="#por-comprar" data-icono="carrito">Por comprar</a>
      <a href="#compra" data-icono="entrada">Registrar compra</a>
      <a href="#movimientos" data-icono="movimientos">Movimientos</a>
      <a href="#stock" data-icono="caja">Stock</a>
      <a href="#config" data-icono="ajustes">Empresa y respaldo</a>
    </nav>
    <button class="tema" data-accion="tema" id="boton-tema"></button>
  </aside>
  <div id="contenido">
    <div class="barra-superior">
      <form class="buscador" data-form="buscar" role="search">
        <span data-icono="buscar"></span>
        <input name="q" placeholder="Buscar material, O/C, factura…" autocomplete="off">
      </form>
    </div>
    <p id="aviso-guardado" class="alerta error" hidden>No se pudo guardar en este navegador. Descarga un respaldo en «Empresa y respaldo» para no perder tus datos.</p>
    <main id="app"></main>
    <footer>Los datos se guardan solo en este navegador y en esta computadora. Descarga un respaldo cada semana.</footer>
  </div>
  <div id="tooltip" role="status" hidden></div>
  <div id="imprimir"></div>
  <script src="js/ordenes-iniciales.js"></script>
  <script src="js/graficos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
